version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: property_db_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: property_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
